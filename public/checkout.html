<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — Adorna Style</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/images/brand/logo.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="announcement-bar">✨ Free delivery across Pakistan on orders above Rs. 2,500</div>

  <header class="site-header">
    <div class="container">
      <a href="/" class="brand">
        <img src="/images/brand/logo.png" alt="Adorna Style logo">
        <div>
          <div class="brand-name">Adorna Style</div>
          <span class="brand-tagline">Be Your Own Kind of Beautiful</span>
        </div>
      </a>
      <nav class="main-nav">
        <a href="/">Home</a>
        <a href="/shop.html">Shop All</a>
      </nav>
      <div class="header-actions">
        <a href="/cart.html" class="icon-btn" aria-label="Cart">
          🛍️
          <span class="cart-count" data-cart-count>0</span>
        </a>
      </div>
    </div>
  </header>

  <div class="page-header">
    <div class="container">
      <h1>Checkout</h1>
    </div>
  </div>

  <div class="container">
    <div class="checkout-layout">
      <div class="form-card">
        <div class="form-error" id="form-error"></div>
        <h3>Delivery Details</h3>
        <form id="checkout-form">
          <div class="form-row">
            <label for="name">Full Name</label>
            <input type="text" id="name" required>
          </div>
          <div class="form-grid-2">
            <div class="form-row">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" placeholder="03xxxxxxxxx" required>
            </div>
            <div class="form-row">
              <label for="email">Email (optional)</label>
              <input type="email" id="email">
            </div>
          </div>
          <div class="form-grid-2">
            <div class="form-row">
              <label for="houseNo">House / Flat No.</label>
              <input type="text" id="houseNo" placeholder="e.g. House 12-B" required>
            </div>
            <div class="form-row">
              <label for="street">Street / Road</label>
              <input type="text" id="street" placeholder="e.g. Street 5" required>
            </div>
          </div>
          <div class="form-grid-2">
            <div class="form-row">
              <label for="area">Area / Block / Sector</label>
              <input type="text" id="area" placeholder="e.g. DHA Phase 6, Block C" required>
            </div>
            <div class="form-row">
              <label for="landmark">Nearby Landmark (optional)</label>
              <input type="text" id="landmark" placeholder="e.g. near ABC Bakers">
            </div>
          </div>
          <div class="form-grid-2">
            <div class="form-row">
              <label for="city">City</label>
              <input type="text" id="city" required>
            </div>
            <div class="form-row">
              <label for="postalCode">Postal Code</label>
              <input type="text" id="postalCode" placeholder="e.g. 54000" required>
            </div>
          </div>
          <div class="form-row">
            <label for="notes">Order Notes (optional)</label>
            <textarea id="notes" rows="2" placeholder="e.g. gift wrap, preferred delivery time"></textarea>
          </div>

          <h3 style="margin-top:26px;">Payment Method</h3>
          <div class="payment-options" id="payment-options">
            <label class="payment-option" data-method="cod">
              <input type="radio" name="paymentMethod" value="cod" checked>
              <span class="icon">💵</span>
              <span>
                <span class="label">Cash on Delivery</span><br>
                <span class="sub">Pay in cash when your order arrives</span>
              </span>
            </label>
            <label class="payment-option" data-method="jazzcash">
              <input type="radio" name="paymentMethod" value="jazzcash">
              <span class="icon">📱</span>
              <span>
                <span class="label">JazzCash</span><br>
                <span class="sub">Pay securely via JazzCash mobile wallet / card</span>
              </span>
            </label>
            <label class="payment-option" data-method="easypaisa">
              <input type="radio" name="paymentMethod" value="easypaisa">
              <span class="icon">📲</span>
              <span>
                <span class="label">Easypaisa</span><br>
                <span class="sub">Pay securely via Easypaisa mobile wallet / card</span>
              </span>
            </label>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="place-order-btn" style="margin-top:20px;">
            Place Order
          </button>
        </form>
      </div>

      <div class="summary-card" id="summary-card">
        <h3 style="margin-bottom:16px;">Order Summary</h3>
        <div id="summary-items"></div>
        <div class="summary-row total">
          <span>Total</span>
          <span id="summary-total">Rs. 0</span>
        </div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <a href="/privacy-policy.html">Privacy Policy</a> · <a href="/terms.html">Terms</a> · <a href="/refund-policy.html">Refund Policy</a><br>
        © 2026 Adorna Style. All rights reserved.
      </div>
    </div>
  </footer>

  <script src="/js/cart.js"></script>
  <script src="/js/api.js"></script>
  <script>
    (async function () {
      const cart = getCart();
      const form = document.getElementById('checkout-form');
      const errorBox = document.getElementById('form-error');
      const placeOrderBtn = document.getElementById('place-order-btn');

      if (!cart.length) {
        window.location.href = '/cart.html';
        return;
      }

      const products = await Api.getProducts();
      const productMap = Object.fromEntries(products.map((p) => [p.id, p]));
      let total = 0;
      const itemsHtml = cart
        .map((item) => {
          const product = productMap[item.id];
          if (!product) return '';
          const lineTotal = product.price * item.qty;
          total += lineTotal;
          return `<div class="summary-row"><span>${product.name} × ${item.qty}</span><span>${formatPKR(lineTotal)}</span></div>`;
        })
        .join('');
      document.getElementById('summary-items').innerHTML = itemsHtml;
      document.getElementById('summary-total').textContent = formatPKR(total);

      document.querySelectorAll('.payment-option').forEach((opt) => {
        opt.addEventListener('click', () => {
          document.querySelectorAll('.payment-option').forEach((o) => o.classList.remove('selected'));
          opt.classList.add('selected');
        });
      });
      document.querySelector('.payment-option').classList.add('selected');

      function showError(message) {
        errorBox.textContent = message;
        errorBox.classList.add('show');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.classList.remove('show');

        const paymentMethod = form.querySelector('input[name="paymentMethod"]:checked').value;
        const payload = {
          customer: {
            name: document.getElementById('name').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            email: document.getElementById('email').value.trim(),
            houseNo: document.getElementById('houseNo').value.trim(),
            street: document.getElementById('street').value.trim(),
            area: document.getElementById('area').value.trim(),
            landmark: document.getElementById('landmark').value.trim(),
            city: document.getElementById('city').value.trim(),
            postalCode: document.getElementById('postalCode').value.trim(),
            notes: document.getElementById('notes').value.trim(),
          },
          items: cart,
          paymentMethod,
        };

        placeOrderBtn.disabled = true;
        placeOrderBtn.textContent = 'Placing order…';

        try {
          const result = await Api.createOrder(payload);
          clearCart();

          if (result.gateway) {
            // Redirect the browser to JazzCash/Easypaisa's hosted checkout page.
            submitToGateway(result.gateway.actionUrl, result.gateway.fields);
          } else {
            window.location.href = `/order-success.html?orderId=${result.orderId}`;
          }
        } catch (err) {
          placeOrderBtn.disabled = false;
          placeOrderBtn.textContent = 'Place Order';
          showError(err.message || 'Something went wrong. Please try again.');
        }
      });
    })();
  </script>
</body>
</html>
